# Builds the API image and publishes it to Docker Hub:
#   push to the Test branch     -> 19631/df-backend:test   (Test environment)
#   push to the master branch   -> 19631/df-backend:prod   (Production)
#   push a version tag (v1.2.3) -> 19631/df-backend:1.2.3  (optional, to mark a release)
# Every image is also tagged with its commit (sha-<short sha>) so a deployment can be pinned exactly.
#
# Repository setting needed (Settings > Secrets and variables > Actions > Secrets):
#   DOCKERHUB_TOKEN     a Docker Hub personal access token with Read & Write access
# Optional: DOCKERHUB_USERNAME (as a variable or a secret) to publish under another account.
name: Backend Docker image

on:
  push:
    branches: [Test, master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || '19631' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_USERNAME }}/df-backend
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/Test' }}
            type=semver,pattern={{version}}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
